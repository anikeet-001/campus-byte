services:
  backend:
    build: ./backend
    environment:
      JWT_SECRET: ${JWT_SECRET:?Generate JWT_SECRET in .env as described in README}
    volumes:
      - campus_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 12
  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
volumes:
  campus_data:
