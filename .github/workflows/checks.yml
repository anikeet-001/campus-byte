name: Campus Byte checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API and test dependencies
        run: pip install -r backend/requirements.txt httpx==0.28.1 playwright==1.55.0
      - name: Run isolated API tests
        run: python -m unittest discover -s tests -v
      - name: Build and start both containers
        run: |
          python -c "import secrets; print('JWT_SECRET='+secrets.token_hex(32))" > .env
          docker compose up --build --wait
      - name: Exercise checkout and delivery in three browser sessions
        run: |
          python -m playwright install --with-deps chromium
          python tests/browser_flow.py
      - name: Stop containers
        if: always()
        run: docker compose down
